name: Cleanup Vast

# SPEC 8.3(г): страховочная уборка зависших арендованных карт.
# SPEC 0.1: запуск по расписанию и вручную; push / pull_request не используются.
on:
  schedule:
    # Каждый час. Расписания GitHub Actions выполняются «по возможности» (best effort):
    # запуск может опоздать или быть пропущен. Поэтому уборка здесь страховка, а не гарантия срока жизни карты.
    - cron: '0 * * * *'
  workflow_dispatch:

# Не допускать параллельных уборок; запущенную не отменять.
concurrency:
  group: cleanup-vast
  cancel-in-progress: false

permissions:
  actions: read    # gh run view
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash   # bash -e -o pipefail

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r Generate/requirements-dev.txt

      - name: Cleanup orphan Vast cards
        env:
          GEN_VAST_API_KEY: ${{ secrets.GEN_VAST_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Правила уборки (метки, статус запуска, предел возраста) находятся в cli.py (cleanup-vast, SPEC 8.3 г).
          python -m Generate.cli cleanup-vast --repo "$REPO" --summary-file "$GITHUB_STEP_SUMMARY"
