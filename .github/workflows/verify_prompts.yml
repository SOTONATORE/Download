# .github/workflows/verify_prompts.yml
name: Verify prompts

# Бесплатная изолированная проверка генерации промптов для выбранного семейства текстовой модели
# (gemini, gemma, nemotron, nemotron-super-vl; провайдер берётся из config.default.yaml).
# Тот же путь подготовки промптов, что у generate.yml (cli.prepare_prompts_only -> build_prompts),
# но без аренды видеокарт, без Vast.ai и без релиза. Ключ Vast.ai не нужен.
on:
  workflow_dispatch:
    inputs:
      srt_path:
        description: "Путь к файлу SRT"
        type: string
        default: "final.srt"
      missing_path:
        description: "Путь к файлу missing"
        type: string
        default: "missing.txt"
      niche:
        description: "Ниша: none = обычный выбор ниже; другое значение = ниша, она переопределяет видео, фото и текстовую модель"
        type: choice
        options:
          - "none"
          - "cartoon"
        default: "none"
      cartoon_i2v:
        description: "Для ниши cartoon: проверить двухэтапный I2V-конвейер (фото для всех + I2V-видео для выбранных)"
        type: boolean
        default: false
      total_video_percent:
        description: "Для cartoon_i2v: общая доля видео от длительности ролика, %"
        type: number
        default: 20
      intro_minutes:
        description: "Для cartoon_i2v: длина вступления, минут"
        type: number
        default: 3
      intro_video_percent:
        description: "Для cartoon_i2v: доля видео во вступлении, %"
        type: number
        default: 70
      after_half_video_percent:
        description: "Для cartoon_i2v: доля видео после 50% ролика, %"
        type: number
        default: 5
      min_anim_sec:
        description: "Для cartoon_i2v: минимальная длительность сегмента для анимации, с"
        type: number
        default: 2.5
      video_profile:
        description: "Видео-модель: ltx25 = видео проверяется; none = видео не проверяется. Варианты сверяются с профилями без поля type (видео)"
        type: choice
        options:
          - "ltx25"
          - "none"
        default: "ltx25"
      photo_profile:
        description: "Фото-модель: zimage_turbo = фото проверяется; none = фото не проверяется. Варианты сверяются с профилями type: image"
        type: choice
        options:
          - "zimage_turbo"
          - "none"
        default: "none"
      video_percent:
        description: "Доля видео, %: какая часть хронометража (по секундам) идёт в видео, остальное в фото. Целое число от 0 до 100"
        type: number
        default: 100
      intro_seconds:
        description: "Вступление, сек: сегменты, чьё начало раньше этого времени, всегда идут в видео, даже сверх бюджета video_percent. По умолчанию 1200 (то же окно, что у поиска в Download)"
        type: number
        default: 1200
      limit_clips:
        # GitHub Actions не поддерживает type: integer, поэтому number
        description: "0 = все клипы из missing; N > 0 = первые N клипов по возрастанию номера"
        type: number
        default: 3
      preset:
        description: "Пресет промптов: none = без пресета; другое значение = файл Generate/model_profiles/presets/prompts/<имя>.md, проверяется до аренды карт (новые пресеты добавляются в список choices)"
        type: choice
        options:
          - "none"
          - "test"
        default: "none"
      text_model:
        description: "Семейство текстовой модели для промптов: auto = модель из профиля ниши, а если ниши нет, из config.default.yaml (default_text_model); nemotron-super-vl, gemini, gemma или nemotron = явный выбор"
        type: choice
        options:
          - "auto"
          - "nemotron-super-vl"
          - "gemini"
          - "gemma"
          - "nemotron"
        default: "auto"
      fail_fast:
        description: "при включении первая ошибка проверки промптов останавливает прогон сразу, без повтора и без исправлений; сырой ответ модели с ошибкой сохраняется в артефакт"
        type: boolean
        default: false

concurrency:
  group: verify-gemini
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    steps:
      - name: Получение репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка зависимостей
        run: pip install -r Generate/requirements-dev.txt

      # lingua нужна только профилю с text_language: srt (язык текста по SRT); имена профилей те же, что у шага промптов
      - name: Нужен ли lingua (язык текста по SRT)
        id: lang_need
        env:
          VIDEO_NAME: ${{ inputs.niche != 'none' && (inputs.cartoon_i2v && format('{0}_i2v', inputs.niche) || 'none') || (inputs.video_profile != 'none' && inputs.video_profile || 'ltx25') }}
          PHOTO_NAME: ${{ inputs.niche != 'none' && inputs.niche || inputs.photo_profile }}
        run: |
          need=false
          for name in "$VIDEO_NAME" "$PHOTO_NAME"; do
            if [ -z "$name" ] || [ "$name" = "none" ]; then continue; fi
            candidates=("Generate/Nishes/$name/profile.yaml" "Generate/model_profiles/models/$name/profile.yaml")
            if [[ "$name" == *_i2v ]]; then
              candidates+=("Generate/Nishes/${name%_i2v}/i2v/profile.yaml")
            fi
            for f in "${candidates[@]}"; do
              if [ -f "$f" ] && grep -Eq '^text_language:[[:space:]]*"?srt"?' "$f"; then need=true; fi
            done
          done
          echo "needed=$need" >> "$GITHUB_OUTPUT"

      - name: Кэш pip для lingua
        if: steps.lang_need.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-lingua-${{ hashFiles('Generate/requirements-lang.txt') }}

      - name: Установка lingua (язык текста по SRT)
        if: steps.lang_need.outputs.needed == 'true'
        run: pip install -r Generate/requirements-lang.txt

      # Входы передаются через env, а не подстановкой в текст скрипта (SPEC 0.2).
      # Имена env совпадают с generate.yml; значения выбора профилей выводятся так же, как там.
      - name: Проверка генерации промптов
        env:
          GEMINI1: ${{ secrets.GEMINI1 }}
          GEMINI2: ${{ secrets.GEMINI2 }}
          GEMINI3: ${{ secrets.GEMINI3 }}
          GEMINI4: ${{ secrets.GEMINI4 }}
          GEMINI5: ${{ secrets.GEMINI5 }}
          GEMINI6: ${{ secrets.GEMINI6 }}
          GEMINI7: ${{ secrets.GEMINI7 }}
          GEMINI8: ${{ secrets.GEMINI8 }}
          GEMINI9: ${{ secrets.GEMINI9 }}
          GEMINI10: ${{ secrets.GEMINI10 }}
          OPENROUTER1: ${{ secrets.OPENROUTER1 }}
          OPENROUTER2: ${{ secrets.OPENROUTER2 }}
          OPENROUTER3: ${{ secrets.OPENROUTER3 }}
          OPENROUTER4: ${{ secrets.OPENROUTER4 }}
          OPENROUTER5: ${{ secrets.OPENROUTER5 }}
          OPENROUTER6: ${{ secrets.OPENROUTER6 }}
          OPENROUTER7: ${{ secrets.OPENROUTER7 }}
          OPENROUTER8: ${{ secrets.OPENROUTER8 }}
          OPENROUTER9: ${{ secrets.OPENROUTER9 }}
          OPENROUTER10: ${{ secrets.OPENROUTER10 }}
          SRT_PATH: ${{ inputs.srt_path }}
          MISSING_PATH: ${{ inputs.missing_path }}
          # выбор моделей (none = модель выключена), как в generate.yml
          # ниша (не none) переопределяет видео и фото; при cartoon_i2v: true включается профиль <niche>_i2v
          VIDEO_MODEL: ${{ inputs.niche != 'none' && (inputs.cartoon_i2v && format('{0}_i2v', inputs.niche) || 'none') || inputs.video_profile }}
          PHOTO_MODEL: ${{ inputs.niche != 'none' && inputs.niche || inputs.photo_profile }}
          # профиль видео: при cartoon_i2v берётся <niche>_i2v; при none запасной ltx25; профиль фото: ниша, иначе выбор фото
          VIDEO_PROFILE: ${{ inputs.niche != 'none' && inputs.cartoon_i2v && format('{0}_i2v', inputs.niche) || (inputs.video_profile != 'none' && inputs.video_profile || 'ltx25') }}
          PHOTO_PROFILE: ${{ inputs.niche != 'none' && inputs.niche || (inputs.photo_profile != 'none' && inputs.photo_profile || '') }}
          # строка '0', а не число: при числе 0 выражение && || вернёт значение выбора
          VIDEO_PERCENT: ${{ inputs.niche != 'none' && '0' || inputs.video_percent }}
          NICHE: ${{ inputs.niche }}
          CARTOON_I2V: ${{ inputs.niche == 'cartoon' && inputs.cartoon_i2v || false }}
          TOTAL_VIDEO_PERCENT: ${{ inputs.total_video_percent }}
          INTRO_MINUTES: ${{ inputs.intro_minutes }}
          INTRO_VIDEO_PERCENT: ${{ inputs.intro_video_percent }}
          AFTER_HALF_VIDEO_PERCENT: ${{ inputs.after_half_video_percent }}
          MIN_ANIM_SEC: ${{ inputs.min_anim_sec }}
          INTRO_SECONDS: ${{ inputs.intro_seconds }}
          LIMIT_CLIPS: ${{ inputs.limit_clips }}
          PRESET: ${{ inputs.preset }}
          # auto = пусто: семейство берётся из профиля фото (ниши) или default_text_model
          TEXT_MODEL: ${{ inputs.text_model != 'auto' && inputs.text_model || '' }}
          # режим fail_fast: GitHub передаёт boolean строкой true или false (разбор в скрипте строгий)
          FAIL_FAST: ${{ inputs.fail_fast }}
          # Журнал как у generate.yml (SPEC 10): файл <каталог артефакта>/run/debug.log на уровне GEN_LOG_LEVEL.
          # Все файлы проверки лежат в одном каталоге артефакта.
          ART_DIR: verify-artifact
          PROMPTS_PATH: verify-artifact/prompts.json
          GEN_LOG_LEVEL: "DEBUG"
        run: |
          python - <<'PY'
          import argparse
          import importlib
          import json
          import logging
          import os
          import sys

          # Имена секретов: GEMINI1…GEMINI10 (как в gemini_pool.py) и OPENROUTER1…OPENROUTER10
          # (как в openrouter_transport.py); значения не выводятся
          GEMINI_NAMES = ("GEMINI1", "GEMINI2", "GEMINI3", "GEMINI4", "GEMINI5",
                          "GEMINI6", "GEMINI7", "GEMINI8", "GEMINI9", "GEMINI10")
          OPENROUTER_NAMES = tuple(f"OPENROUTER{i}" for i in range(1, 11))
          # Маскируются только значения длиной не меньше MASK_MIN_LEN (оба набора). Короче — не маскируются:
          # выводится предупреждение без значения. Длина каждого непустого секрета печатается один раз.
          MASK_MIN_LEN = 20
          secret_all = {k: os.environ.get(k, "").strip() for k in GEMINI_NAMES + OPENROUTER_NAMES}
          for k, value in secret_all.items():
              if value:
                  print(f"{k}: длина {len(value)}")
                  if len(value) < MASK_MIN_LEN:
                      print(f"Секрет {k} короче {MASK_MIN_LEN} символов (длина {len(value)}): маскировка для него пропущена, проверьте значение в настройках репозитория.")
          secret_values = sorted({v for v in secret_all.values() if len(v) >= MASK_MIN_LEN}, key=len, reverse=True)
          SUMMARY = os.environ.get("GITHUB_STEP_SUMMARY")


          def mask(text) -> str:
              text = str(text)
              for value in secret_values:
                  text = text.replace(value, "***")
              return text


          def say(text: str = "") -> None:
              print(mask(text))


          def summary(text: str = "") -> None:
              if SUMMARY:
                  with open(SUMMARY, "a", encoding="utf-8") as fh:
                      fh.write(mask(text) + "\n")


          def fail(text: str) -> None:
              say("ОШИБКА: " + text)
              summary("## Проверка промптов: ОШИБКА\n\n" + text)
              sys.exit(1)


          def find_symbol(name, modules):
              for prefix in ("Generate.core.", "core.", ""):
                  for mod in modules:
                      try:
                          module = importlib.import_module(prefix + mod)
                      except ImportError:
                          continue
                      obj = getattr(module, name, None)
                      if obj is not None:
                          return obj
              return None


          # Семейство текстовой модели: провайдер из config.default.yaml, как у cli (resolve_text_family).
          # Проверяются ключи только провайдера семейства; для gemini это GEMINI1…GEMINI10, как раньше.
          from Generate.core.config_loader import load_config
          try:
              cfg = load_config()
          except Exception as exc:  # noqa: BLE001
              fail("не удалось прочитать config.default.yaml: " + type(exc).__name__ + ": " + mask(exc))

          # Приоритет как у cli.resolve_text_family: TEXT_MODEL > text_model профиля фото (ниши) > default_text_model.
          # Профиль фото ищется как config_loader.profile_dir: сначала models/, затем Nishes/.
          def photo_profile_text_model(name):
              # text_model из profile.yaml профиля фото; нет файла или ключа — None
              folder = os.path.join("Generate", "model_profiles", "models", name)
              if not os.path.isdir(folder):
                  folder = os.path.join("Generate", "Nishes", name)
              path = os.path.join(folder, "profile.yaml")
              if not os.path.isfile(path):
                  return None
              import yaml
              with open(path, encoding="utf-8") as fh:
                  data = yaml.safe_load(fh) or {}
              value = data.get("text_model") if isinstance(data, dict) else None
              return value.strip() if isinstance(value, str) and value.strip() else None


          text_env = os.environ.get("TEXT_MODEL", "").strip()
          photo_profile_env = os.environ.get("PHOTO_PROFILE", "").strip()
          # без TEXT_MODEL и без профиля фото ответ тот же, что раньше (None -> cli берёт профиль видео или конфиг)
          text_from_photo = photo_profile_text_model(photo_profile_env) if (not text_env and photo_profile_env) else None
          family = text_env or text_from_photo or cfg.default_text_model
          spec = cfg.text_model_families.get(family)
          if spec is None:
              fail("неизвестное семейство текстовой модели: " + family)
          if spec["provider"] == "openrouter":
              KEY_NAMES, KEY_HINT, KEY_LABEL = OPENROUTER_NAMES, "OPENROUTER1…OPENROUTER10", "OpenRouter"
          else:
              KEY_NAMES, KEY_HINT, KEY_LABEL = GEMINI_NAMES, "GEMINI1…GEMINI10", "Gemini"
          family_values = sorted({os.environ.get(k, "").strip() for k in KEY_NAMES} - {""}, key=len, reverse=True)
          if not family_values:
              fail(f"ни один из ключей {KEY_HINT} не задан в настройках репозитория")
          say(f"Найдено ключей {KEY_LABEL}: {len(family_values)}")

          # Журнал как в cli.py: консоль и файл <ART_DIR>/run/debug.log на уровне GEN_LOG_LEVEL (пусто = INFO).
          log_level = os.environ.get("GEN_LOG_LEVEL", "").strip() or "INFO"
          if log_level not in ("INFO", "DEBUG"):
              fail("GEN_LOG_LEVEL допускает только значения INFO и DEBUG")
          art_dir = os.environ.get("ART_DIR", "").strip() or None
          setup_logging = find_symbol("setup_logging", ("log_setup",))
          set_known_secrets = find_symbol("set_known_secrets", ("log_setup",))
          if setup_logging is None:
              fail("в проекте не найден символ setup_logging")
          if set_known_secrets is not None:
              set_known_secrets(secret_values)  # ключи маскируются в журнале даже без имени (log_setup.py)
          # HTTP-библиотеки на DEBUG оставляем на WARNING, как в cli.py
          for noisy in ("httpx", "httpcore", "urllib3"):
              logging.getLogger(noisy).setLevel(logging.WARNING)
          if art_dir:
              os.makedirs(art_dir, exist_ok=True)
          handlers, log_note = setup_logging(log_level, art_dir)
          if log_note:
              say(log_note)

          video_model = os.environ["VIDEO_MODEL"]
          photo_model = os.environ["PHOTO_MODEL"]
          if video_model == "none" and photo_model == "none":
              fail("видео и фото выключены: проверять нечего")
          for name in ("SRT_PATH", "MISSING_PATH"):
              path = os.environ[name]
              if not os.path.isfile(path):
                  fail(f"файл не найден: {path}")

          try:
              limit = int(float(os.environ.get("LIMIT_CLIPS") or 0))
          except ValueError:
              fail("limit_clips должен быть числом")

          # fail_fast: строго true или false; другое значение — ошибка до аренды карт
          fail_fast_text = os.environ.get("FAIL_FAST", "").strip()
          if fail_fast_text not in ("true", "false"):
              fail("FAIL_FAST допускает только значения true и false")
          fail_fast = fail_fast_text == "true"

          cartoon_i2v_text = os.environ.get("CARTOON_I2V", "false").strip()
          if cartoon_i2v_text not in ("true", "false"):
              fail("CARTOON_I2V допускает только значения true и false")
          cartoon_i2v = cartoon_i2v_text == "true"

          # Для ниши cartoon (или cartoon_i2v) оптимизируем весь SRT до подготовки промптов.
          srt_for_prep = os.environ["SRT_PATH"]
          if os.environ.get("NICHE", "").strip() == "cartoon" or cartoon_i2v:
              from Generate.core.srt_optimizer import DEFAULT_TARGET_SEC, format_stats, optimize_srt_file
              opt_srt_path = os.path.join(art_dir, "final_optimized.srt")
              try:
                  opt_stats = optimize_srt_file(srt_for_prep, opt_srt_path, min_sec=2.5, max_sec=5.0)
              except Exception as exc:  # noqa: BLE001
                  fail("оптимизация SRT не удалась: " + type(exc).__name__ + ": " + mask(exc))
              for w in opt_stats.warnings:
                  say("ВНИМАНИЕ (оптимизация SRT): " + w)
              opt_line = format_stats(opt_stats, 2.5, DEFAULT_TARGET_SEC, 5.0)
              say(opt_line)
              summary(opt_line)
              srt_for_prep = opt_srt_path

          # Тот же путь, что у cli run: профили, пресет, распределение, промпты (без Vast и релиза).
          from Generate.cli import prepare_prompts_only

          ns = argparse.Namespace(
              srt=srt_for_prep,
              missing=os.environ["MISSING_PATH"],
              prompts_path=os.environ["PROMPTS_PATH"],
              artifact_dir=art_dir,
              video_model=video_model,
              video_profile=os.environ["VIDEO_PROFILE"],
              photo_profile=os.environ.get("PHOTO_PROFILE") or None,
              video_percent=os.environ.get("VIDEO_PERCENT") or "100",
              intro_seconds=os.environ.get("INTRO_SECONDS") or "1200",
              limit_clips=limit,
              preset=os.environ.get("PRESET") or "none",
              # та же семья, что проверили по ключам: иначе прогон взял бы text_model профиля видео
              text_model=text_env or text_from_photo or None,
              fail_fast=fail_fast,
              i2v_mode=cartoon_i2v,
              total_video_percent=float(os.environ.get("TOTAL_VIDEO_PERCENT") or 20.0),
              intro_minutes=float(os.environ.get("INTRO_MINUTES") or 3.0),
              intro_video_percent=float(os.environ.get("INTRO_VIDEO_PERCENT") or 70.0),
              after_half_video_percent=float(os.environ.get("AFTER_HALF_VIDEO_PERCENT") or 5.0),
              min_anim_sec=float(os.environ.get("MIN_ANIM_SEC") or 2.5),
          )
          try:
              prep = prepare_prompts_only(ns)
          except Exception as exc:  # noqa: BLE001
              fail("подготовка промптов не удалась: " + type(exc).__name__ + ": " + mask(exc))

          # Распределение по всему хронометражу берётся из distribution.json (записан до лимита), а не из выборки.
          from Generate.core.segment_split import WINDOW_SECONDS

          dist_file = os.path.join(art_dir, "distribution.json")
          if not os.path.isfile(dist_file):
              fail("распределение не найдено: " + dist_file)
          with open(dist_file, encoding="utf-8") as fh:
              dist_segments = json.load(fh)["segments"]
          split_video = sum(1 for r in dist_segments if r["mode"] == "video")
          split_photo = len(dist_segments) - split_video
          per_window = {}
          for r in dist_segments:
              counts = per_window.setdefault(int(r["start"] // WINDOW_SECONDS), [0, 0])
              counts[0 if r["mode"] == "video" else 1] += 1
          zero_video = sum(1 for n_video, _ in per_window.values() if n_video == 0)
          zero_photo = sum(1 for _, n_photo in per_window.values() if n_photo == 0)
          extra = [
              f"- Распределение по всему хронометражу: видео {split_video}, фото {split_photo} сегментов",
              f"- Проверено в выборке: видео {len(prep.video_nums)}, фото {len(prep.photo_nums)} сегментов",
              f"- Окон {WINDOW_SECONDS} с без видео: {zero_video}, окон без фото: {zero_photo}",
          ]
          lines = prep.report_md.splitlines()
          at = next(i for i, text in enumerate(lines) if text.startswith("- Видео-сегментов:")) + 1
          report_md = "\n".join(lines[:at] + extra + lines[at:]) + "\n"

          with open(os.path.join(art_dir, "report.md"), "w", encoding="utf-8") as fh:
              fh.write(mask(report_md))
          summary(report_md)
          for line in report_md.splitlines():
              say(line)

          # Ключи профилей проверки (по умолчанию выключены; ltx25 и zimage_turbo их не задают).
          # Имена ниш в коде не сравниваются: читаются ключи профилей, активных в этом прогоне.
          from Generate.core.config_loader import (
              GeminiInputError, load_profile_fail_on_duplicate_prompts, load_profile_fail_on_needs_review)
          from Generate.core.duplicate_check import find_duplicate_prompts
          video_profile_env = os.environ["VIDEO_PROFILE"]
          try:
              fail_review_photo = load_profile_fail_on_needs_review(photo_profile_env)
              fail_dup_photo = load_profile_fail_on_duplicate_prompts(photo_profile_env)
              fail_review_video = video_model != "none" and load_profile_fail_on_needs_review(video_profile_env)
              fail_dup_video = video_model != "none" and load_profile_fail_on_duplicate_prompts(video_profile_env)
          except GeminiInputError as exc:  # ошибка входа в профиле: код выхода 2, как у прочих ошибок входа
              say("ОШИБКА: " + mask(exc))
              summary("## Проверка промптов: ОШИБКА\n\n" + mask(exc))
              sys.exit(2)

          if fail_review_photo or fail_review_video or fail_dup_photo or fail_dup_video:
              prompts_file = os.environ["PROMPTS_PATH"]
              if not os.path.isfile(prompts_file):
                  fail("файл промптов не найден: " + prompts_file)
              with open(prompts_file, encoding="utf-8") as fh:
                  state_prompts = json.load(fh).get("prompts", {})

              # клипы, оставшиеся на проверке, по профилям с ключом fail_on_needs_review
              if fail_review_photo or fail_review_video:
                  review_nums = []
                  if fail_review_photo:
                      review_nums += [n for n in prep.photo_nums if (state_prompts.get(str(n)) or {}).get("needs_review")]
                  if fail_review_video:
                      review_key = "video_needs_review" if cartoon_i2v else "needs_review"
                      review_nums += [n for n in prep.video_nums if (state_prompts.get(str(n)) or {}).get(review_key)]
                  if review_nums:
                      nums = sorted(set(review_nums))
                      fail("промпт на проверке (needs_review) у клипов: " + ", ".join(str(n) for n in nums))

              # одинаковые промпты у разных клипов, по профилям с ключом fail_on_duplicate_prompts
              if fail_dup_photo or fail_dup_video:
                  dup_nums = (list(prep.photo_nums) if fail_dup_photo else []) + \
                             (list(prep.video_nums) if fail_dup_video else [])
                  groups = find_duplicate_prompts(
                      {str(n): (state_prompts.get(str(n)) or {}).get("prompt", "") for n in dup_nums})
                  if groups:
                      listed = "; ".join("клипы " + ", ".join(g) for g in groups)
                      fail("одинаковые промпты у разных клипов: " + listed)

          if prep.problems or prep.failures:
              # «промпт не готов» печатаем одной сводкой (номера клипов диапазонами), а не строкой на клип;
              # остальные проблемы — по одной строке, как раньше
              not_ready = []
              for p in prep.problems:
                  head, tail = "клип ", ": промпт не готов"
                  middle = p[len(head):-len(tail)] if p.startswith(head) and p.endswith(tail) else ""
                  if middle.isdigit():
                      not_ready.append(int(middle))
                  else:
                      say("ПРОБЛЕМА: " + p)
              if not_ready:
                  nums = sorted(set(not_ready))
                  ranges = []  # [первый, последний] подряд идущих номеров клипов
                  for n in nums:
                      if ranges and n == ranges[-1][1] + 1:
                          ranges[-1][1] = n
                      else:
                          ranges.append([n, n])
                  parts = [str(a) if a == b else f"{a}–{b}" for a, b in ranges[:20]]
                  more = f" и ещё {len(ranges) - 20} диапазонов" if len(ranges) > 20 else ""
                  say(f"ПРОБЛЕМА: промпт не готов у клипов: {len(nums)}")
                  say("Номера клипов: " + ", ".join(parts) + more)
              sys.exit(1)
          say(f"Проверка пройдена: промптов {len(prep.missing)}")
          PY

      - name: Загрузка prompts.json, distribution.json, отчёта и журнала
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-prompts-files
          # все файлы проверки лежат в каталоге verify-artifact; run/debug.log — журнал проверки
          path: |
            verify-artifact/prompts.json
            verify-artifact/distribution.json
            verify-artifact/report.md
            verify-artifact/final_optimized.srt
            verify-artifact/run/debug.log
            verify-artifact/raw/
