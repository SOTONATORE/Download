name: Generate

# SPEC 0.1: только ручной запуск. Никаких push / pull_request.
on:
  workflow_dispatch:
    inputs:
      srt_path:
        description: "Путь к файлу SRT"
        type: string
        default: "final.srt"
      missing_path:
        description: "Путь к файлу missing"
        type: string
        default: "missing.txt"
      limit_clips:
        description: "0 = все клипы; N > 0 = первые N клипов (пробный прогон)"
        type: string
        default: "0"
      release_tag:
        description: "Пользовательский тег Release (необязательно)"
        type: string
        default: ""
      max_cards:
        description: "Максимальное число параллельных видеокарт"
        type: string
        default: "4"
      budget_limit_usd:
        description: "Жёсткий потолок бюджета на запуск (USD)"
        type: string
        default: "5.0"
      min_balance_usd:
        description: "Минимальный баланс Vast.ai для старта (USD); не меньше бюджета, ниже = запуск не стартует"
        type: string
        default: "5.0"
      model_profile:
        description: "Профиль видеомодели"
        type: string
        default: "ltx25"
      style_brief:
        description: "Краткое описание стиля/сюжета от пользователя"
        type: string
        default: ""
      gpu_name:
        description: "Модель видеокарты на Vast.ai"
        type: string
        default: "RTX 5090"
      min_price_per_hour:
        description: "Минимальная цена аренды ($/ч, отсекает битые карты)"
        type: string
        default: "0.35"
      max_price_per_hour:
        description: "Максимальная цена аренды ($/ч)"
        type: string
        default: "0.90"
      min_reliability:
        description: "Минимальная надёжность хоста (0-1)"
        type: string
        default: "0.95"
      min_inet_mbps:
        description: "Минимальная скорость интернета карты (Мбит/с)"
        type: string
        default: "2000"
      docker_image:
        description: "пусто = образ этого коммита"
        type: string
        default: ""
      disk_gb:
        description: "Размер диска карты Vast.ai, ГБ"
        type: number
        default: 100
      silent_host_timeout_min:
        description: "Таймаут первого ответа хоста, минут"
        type: number
        default: 20
      debug_logs:
        description: "Подробный лог (DEBUG) для разбора проблем"
        type: boolean
        default: false

# SPEC 8.2: не допускать параллельных запусков; запущенный не отменять.
concurrency:
  group: generate
  cancel-in-progress: false

permissions:
  contents: write   # создание/обновление Release через gh CLI
  actions: read
  packages: read    # проверка образа воркера в GHCR на шаге check (SPEC 8.4)

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash   # bash -e -o pipefail
    env:
      # полный вывод шага run (после маскирования секретов), артефакт шага «Upload run log»
      RUN_LOG: /tmp/generate-run.log

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r Generate/requirements-dev.txt

      # Значения входов передаются через env, а не подстановкой в текст скрипта:
      # так свободный текст (style_brief и др.) не может внедрить shell-команды.
      # Предстартовая проверка (SPEC 8.4): образ сборки этого коммита должен быть в GHCR до любого
      # вызова Vast. GH_TOKEN передаётся в docker login через stdin, в аргументах команды его нет.
      - name: Preflight check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRT_PATH: ${{ inputs.srt_path }}
          MISSING_PATH: ${{ inputs.missing_path }}
          DOCKER_IMAGE: ${{ inputs.docker_image }}
          WORKER_BUILD: ${{ github.sha }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          python -m Generate.cli check --srt "$SRT_PATH" --missing "$MISSING_PATH" \
            --docker-image "$DOCKER_IMAGE" --worker-build "$WORKER_BUILD"

      - name: Run generation
        env:
          GEN_GEMINI_API_KEY: ${{ secrets.GEN_GEMINI_API_KEY }}
          GEN_VAST_API_KEY: ${{ secrets.GEN_VAST_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRT_PATH: ${{ inputs.srt_path }}
          MISSING_PATH: ${{ inputs.missing_path }}
          LIMIT_CLIPS: ${{ inputs.limit_clips }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          MAX_CARDS: ${{ inputs.max_cards }}
          BUDGET_LIMIT: ${{ inputs.budget_limit_usd }}
          MIN_BALANCE: ${{ inputs.min_balance_usd }}
          MODEL_PROFILE: ${{ inputs.model_profile }}
          STYLE_BRIEF: ${{ inputs.style_brief }}
          GPU_NAME: ${{ inputs.gpu_name }}
          MIN_PRICE: ${{ inputs.min_price_per_hour }}
          MAX_PRICE: ${{ inputs.max_price_per_hour }}
          MIN_RELIABILITY: ${{ inputs.min_reliability }}
          MIN_INET: ${{ inputs.min_inet_mbps }}
          DOCKER_IMAGE: ${{ inputs.docker_image }}
          WORKER_BUILD: ${{ github.sha }}
          DISK_GB: ${{ inputs.disk_gb }}
          SILENT_HOST_TIMEOUT_MIN: ${{ inputs.silent_host_timeout_min }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          GEN_LOG_LEVEL: ${{ inputs.debug_logs && 'DEBUG' || 'INFO' }}
        run: |
          # --docker-image пусто = образ этого коммита (тег = WORKER_BUILD, SPEC 8.4)
          args=(
            --srt "$SRT_PATH"
            --missing "$MISSING_PATH"
            --limit-clips "$LIMIT_CLIPS"
            --max-cards "$MAX_CARDS"
            --budget-limit "$BUDGET_LIMIT"
            --min-balance-usd "$MIN_BALANCE"
            --model-profile "$MODEL_PROFILE"
            --style-brief "$STYLE_BRIEF"
            --gpu-name "$GPU_NAME"
            --min-price-per-hour "$MIN_PRICE"
            --max-price-per-hour "$MAX_PRICE"
            --min-reliability "$MIN_RELIABILITY"
            --min-inet-mbps "$MIN_INET"
            --disk-gb "$DISK_GB"
            --silent-host-timeout-min "$SILENT_HOST_TIMEOUT_MIN"
            --repo "$REPO"
            --run-id "$RUN_ID"
            --docker-image "$DOCKER_IMAGE"
            --worker-build "$WORKER_BUILD"
          )
          if [ -n "$RELEASE_TAG" ]; then
            args+=(--release-tag "$RELEASE_TAG")
          fi

          # Фильтр маскирует значения секретов до записи в сводку и в файл лога (SPEC 0.1):
          # GitHub прячет секреты только в журнале шага, а файл артефакта публичен.
          # Короткие значения (< 8 символов) не трогаем, чтобы не испортить обычный текст.
          mask_filter="$RUNNER_TEMP/mask_filter.py"
          cat > "$mask_filter" <<'PY'
          import os
          import sys

          values = sorted(
              {os.environ.get(k, "").strip() for k in (
                  "GEN_GEMINI_API_KEY", "GEN_VAST_API_KEY", "HF_TOKEN", "GH_TOKEN")} - {""},
              key=len, reverse=True)
          values = [v for v in values if len(v) >= 8]
          for line in sys.stdin:
              for v in values:
                  line = line.replace(v, "***")
              sys.stdout.write(line)
              sys.stdout.flush()
          PY

          {
            echo '## Итоги генерации'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # pipefail: код завершения берётся от python, а не от фильтра и tee;
          # rc сохраняем, чтобы закрыть блок кода и затем завершить шаг тем же кодом
          rc=0
          python -m Generate.cli run "${args[@]}" 2>&1 \
            | python3 -I -u "$mask_filter" \
            | tee -a "$GITHUB_STEP_SUMMARY" "$RUN_LOG" || rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # SPEC 8.3 (в): выполняется всегда — при ошибке, таймауте и отмене.
      # Шаг 1: сначала немедленно гасим карты, чтобы остановить списание денег.
      - name: Kill rented cards
        if: always()
        timeout-minutes: 5
        env:
          GEN_VAST_API_KEY: ${{ secrets.GEN_VAST_API_KEY }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python -m Generate.cli kill-cards --run-id "$RUN_ID"

      # Шаг 2: выдаём уже готовые клипы (prompts.json и generated_links.txt).
      - name: Finalize release on completion or cancel
        if: always()
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRT_PATH: ${{ inputs.srt_path }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          MODEL_PROFILE: ${{ inputs.model_profile }}
          REPO: ${{ github.repository }}
        run: |
          args=(
            --repo "$REPO"
            --srt "$SRT_PATH"
            --model-profile "$MODEL_PROFILE"
          )
          if [ -n "$RELEASE_TAG" ]; then
            args+=(--release-tag "$RELEASE_TAG")
          fi
          python -m Generate.cli finalize-release "${args[@]}"

      # Полный лог шага run (с маскированием) сохраняется даже при отмене и ошибке.
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generate-run-log-${{ github.run_id }}
          path: ${{ env.RUN_LOG }}
          retention-days: 30
          if-no-files-found: warn
