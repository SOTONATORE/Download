name: Generate test (no Gemini, no weights)

# Тест пути запуска воркера без Gemini и без весов: одна карта тем же путём аренды (_rent_one), что у основного запуска,
# готовность по GET /health воркера (ComfyUI готов), затем уборка. Копия pilot-comfyui.yml с отличиями:
# образ — из config.default.yaml (путь generate); флаг --test-no-gemini; SKIP_WEIGHTS=1 на шаге запуска;
# Gemini, Release, HF_TOKEN и токен релиза на шаг запуска не передаются; метка карт gen-<run_id> (как у generate).
# SPEC 0.1: только ручной запуск. Никаких push / pull_request / schedule.
on:
  workflow_dispatch:
    inputs:
      budget_limit_usd:
        description: "Жёсткий потолок бюджета на запуск (USD)"
        type: string
        default: "1.0"
      min_balance_usd:
        description: "Минимальный баланс Vast.ai для старта (USD)"
        type: string
        default: "2.0"
      gpu_name:
        description: "Модель видеокарты на Vast.ai"
        type: string
        default: "RTX 3060"
      min_price_per_hour:
        description: "Минимальная цена аренды ($/ч)"
        type: string
        default: "0.35"
      max_price_per_hour:
        description: "Максимальная цена аренды ($/ч)"
        type: string
        default: "0.35"
      min_reliability:
        description: "Минимальная надёжность хоста (0-1)"
        type: string
        default: "0.95"
      min_inet_mbps:
        description: "Минимальная скорость интернета карты (Мбит/с)"
        type: string
        default: "800"
      max_inet_price_per_tb:
        description: "Максимальная цена трафика карты (USD за ТБ)"
        type: string
        default: "4.1"
      verified:
        description: "Только проверенные хосты Vast: 1 = да, 0 = нет"
        type: choice
        options:
          - "1"
          - "0"
        default: "1"
      rental_type:
        description: "Режим аренды карт Vast: interruptible или on-demand"
        type: choice
        options:
          - "interruptible"
          - "on-demand"
        default: "on-demand"
      disk_gb:
        description: "Размер диска карты Vast.ai, ГБ"
        type: number
        default: 100
      silent_host_timeout_min:
        description: "Таймаут до ответа воркера (healthcheck), минут"
        type: number
        default: 10

# отдельная группа: тест не блокирует и не отменяет боевой generate и пилот; запущенный не отменять
concurrency:
  group: generate-test
  cancel-in-progress: false

permissions:
  contents: read    # Release не пишем: тест его не трогает
  actions: read

jobs:
  generate-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash   # bash -e -o pipefail
    env:
      RUN_LOG: /tmp/generate-test-run.log

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r Generate_test/requirements-dev.txt

      - name: Run generate test
        env:
          GEN_VAST_API_KEY: ${{ secrets.GEN_VAST_API_KEY }}
          VAST_SSH_KEY: ${{ secrets.VAST_SSH_KEY }}
          BUDGET_LIMIT: ${{ inputs.budget_limit_usd }}
          MIN_BALANCE: ${{ inputs.min_balance_usd }}
          GPU_NAME: ${{ inputs.gpu_name }}
          MIN_PRICE: ${{ inputs.min_price_per_hour }}
          MAX_PRICE: ${{ inputs.max_price_per_hour }}
          MIN_RELIABILITY: ${{ inputs.min_reliability }}
          MIN_INET: ${{ inputs.min_inet_mbps }}
          MAX_INET_PRICE: ${{ inputs.max_inet_price_per_tb }}
          VERIFIED: ${{ inputs.verified }}
          RENTAL_TYPE: ${{ inputs.rental_type }}
          DISK_GB: ${{ inputs.disk_gb }}
          SILENT_HOST_TIMEOUT_MIN: ${{ inputs.silent_host_timeout_min }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          GIT_SHA: ${{ github.sha }}
          SKIP_WEIGHTS: "1"
          GEN_LOG_LEVEL: "DEBUG"
        run: |
          # образ не задаётся: берётся из config.default.yaml (путь generate); веса не грузятся (SKIP_WEIGHTS=1)
          # номер сборки воркера = коммит (как у generate): карта скачивает код воркера по этому SHA
          args=(
            --budget-limit "$BUDGET_LIMIT"
            --min-balance-usd "$MIN_BALANCE"
            --gpu-name "$GPU_NAME"
            --min-price-per-hour "$MIN_PRICE"
            --max-price-per-hour "$MAX_PRICE"
            --min-reliability "$MIN_RELIABILITY"
            --min-inet-mbps "$MIN_INET"
            --max-inet-price-per-tb "$MAX_INET_PRICE"
            --verified "$VERIFIED"
            --rental-type "$RENTAL_TYPE"
            --disk-gb "$DISK_GB"
            --silent-host-timeout-min "$SILENT_HOST_TIMEOUT_MIN"
            --repo "$REPO"
            --run-id "$RUN_ID"
            --worker-build "$GIT_SHA"
            --test-no-gemini
            --artifact-dir "$RUNNER_TEMP/generate-test-artifact"
            --debug-logs
          )
          # Фильтр маскирует значения секретов до записи в лог (SPEC 0.1). Ключи Gemini и GH сюда не передаются.
          # Фильтр маскирует только однострочные значения (построчная замена). Тело ключа VAST_SSH_KEY наш код
          # не печатает; маска по нему здесь не задана, так как многострочный ключ построчным фильтром не покрывается.
          mask_code='
          import os, sys
          vals = sorted({os.environ.get(k, "").strip() for k in ("GEN_VAST_API_KEY",)} - {""}, key=len, reverse=True)
          vals = [v for v in vals if len(v) >= 8]
          for line in sys.stdin:
              for v in vals:
                  line = line.replace(v, "***")
              sys.stdout.write(line)
              sys.stdout.flush()
          '
          {
            echo '## Итоги теста генерации (без Gemini и весов)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rc=0
          python -m Generate_test.cli run "${args[@]}" 2>&1 \
            | python3 -I -u -c "$mask_code" \
            | tee -a "$RUN_LOG" || rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # Выполняется всегда. Метка карт теста: gen-<run_id> (та же, что у карт запуска; см. orchestrator.label).
      - name: Kill rented cards
        if: always()
        timeout-minutes: 5
        env:
          GEN_VAST_API_KEY: ${{ secrets.GEN_VAST_API_KEY }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mask_code='
          import os, sys
          vals = sorted({os.environ.get(k, "").strip() for k in ("GEN_VAST_API_KEY",)} - {""}, key=len, reverse=True)
          vals = [v for v in vals if len(v) >= 8]
          for line in sys.stdin:
              for v in vals:
                  line = line.replace(v, "***")
              sys.stdout.write(line)
              sys.stdout.flush()
          '
          python -m Generate_test.cli kill-cards --label "gen-$RUN_ID" 2>&1 \
            | python3 -I -u -c "$mask_code" \
            | tee -a "$RUN_LOG"

      - name: Collect generate test output
        if: always()
        run: |
          dir="$RUNNER_TEMP/generate-test-artifact"
          mkdir -p "$dir"
          if [ -f "$RUN_LOG" ]; then
            cp "$RUN_LOG" "$dir/generate-test-run.log"
          else
            echo "WARNING: лог запуска $RUN_LOG не найден, в артефакт он не попадёт"
          fi

      # Артефакт теста: каталог --artifact-dir с лог запуска. Загружается при любом исходе.
      - name: Upload generate test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generate-test-${{ github.run_id }}
          path: ${{ runner.temp }}/generate-test-artifact
          retention-days: 30
          if-no-files-found: warn
