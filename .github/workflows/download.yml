name: Download Media Archive
on:
  workflow_dispatch:
    inputs:
      srt_path:
        description: 'Путь к SRT-файлу в репозитории (для генерации поисковых запросов через Gemini, а затем автоматического подбора медиа через search.py). Оставь пустым, если сейчас не нужно.'
        required: false
        type: string
      links:
        description: 'Вставь СЮДА готовый список ссылок вручную (обходит generate_queries/search.py). Оставь пустым, если сейчас не нужно.'
        required: false
        type: string

permissions:
  contents: write   # нужно, чтобы workflow мог создавать Release

jobs:
  # -------------------------------------------------------------------------
  # Шаг 1: SRT -> requests.json через Gemini (structured output).
  # Запускается, только если при ручном триггере заполнено поле srt_path.
  # -------------------------------------------------------------------------
  generate_queries:
    if: ${{ inputs.srt_path != '' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install query-generation deps
      run: pip install -U google-genai

    - name: Generate search queries via Gemini
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python generate_queries.py --input "${{ inputs.srt_path }}" --output requests.json

    - name: Upload requests.json as artifact
      uses: actions/upload-artifact@v4
      with:
        name: requests-json
        path: requests.json
        retention-days: 14

  # -------------------------------------------------------------------------
  # Шаг 2: requests.json -> links.txt/missing.txt через search.py.
  # Запускается автоматически следом за generate_queries (тот же ручной триггер
  # через srt_path), отдельным job'ом - чтобы CLIP/torch ставились и кэшировались
  # только тогда, когда реально нужны.
  # -------------------------------------------------------------------------
  search_media:
    needs: generate_queries
    if: ${{ !cancelled() && inputs.srt_path != '' && needs.generate_queries.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Download requests.json artifact
      uses: actions/download-artifact@v4
      with:
        name: requests-json

    # Кэш весов CLIP (open_clip тянет их через huggingface_hub) - без кэша каждый
    # запуск заново качает ~350МБ для ViT-B-32. Ключ включает модель/pretrained,
    # чтобы смена SEARCH_CLIP_MODEL/_PRETRAINED не подсунула чужой кэш.
    - name: Cache CLIP weights
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/huggingface
          ~/.cache/clip
          ~/.cache/torch
        key: clip-weights-${{ runner.os }}-${{ env.SEARCH_CLIP_MODEL || 'ViT-B-32' }}-${{ env.SEARCH_CLIP_PRETRAINED || 'openai' }}

    - name: Install search deps (CPU-only torch/torchvision first, чтобы не тянуть CUDA-сборку)
      run: |
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install aiohttp pillow open_clip_torch

    - name: Run search.py
      env:
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      run: python search.py --input requests.json --links-output links.txt --missing-output missing.txt

    - name: Show missing segments summary
      run: |
        echo "## Пропущенные сегменты (ничего не найдено)" >> "$GITHUB_STEP_SUMMARY"
        if [ -s missing.txt ]; then
          echo "Количество: $(wc -l < missing.txt)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat missing.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Нет пропущенных сегментов." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload links.txt / missing.txt as artifact
      uses: actions/upload-artifact@v4
      with:
        name: search-links
        path: |
          links.txt
          missing.txt
        retention-days: 14

  # -------------------------------------------------------------------------
  # Шаг 3: готовые ссылки -> скачивание -> GitHub Release.
  # Источник ссылок: либо артефакт от search_media (когда запуск шёл через
  # srt_path), либо ручной ввод inputs.links (старый сценарий, без изменений).
  #
  # links.txt используется ЗДЕСЬ ТОЛЬКО как временный вход для download.py (через
  # INPUT_LINKS) - в релиз он не публикуется и артефактом до конца прогона не
  # является (это осознанно: он не нужен никому после того, как файлы скачаны).
  # Наружу (в релиз) идут missing.txt - объединённый список номеров, для которых
  # так ничего и не удалось получить: те, что не нашёл search.py, ПЛЮС те, что
  # search.py нашёл, но download.py не смог скачать (см. шаг "Merge failed
  # downloads into missing.txt" и download_failed.txt в download.py) - и,
  # отдельно, download_failed.txt (только если реально что-то не скачалось).
  # -------------------------------------------------------------------------
  download:
    needs: search_media
    if: ${{ !cancelled() && (inputs.links != '' || needs.search_media.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Download Tools with Impersonation
      run: |
        pip install -U "yt-dlp[default,curl-cffi]" cloudscraper

    - name: Download search-links artifact (если ссылки пришли из search.py)
      if: needs.search_media.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: search-links

    - name: Load INPUT_LINKS from search.py output
      if: needs.search_media.result == 'success'
      run: |
        echo "INPUT_LINKS<<EOF" >> "$GITHUB_ENV"
        cat links.txt >> "$GITHUB_ENV"
        echo "EOF" >> "$GITHUB_ENV"

    - name: Load INPUT_LINKS from manual input (старый сценарий)
      if: needs.search_media.result != 'success'
      run: |
        echo "INPUT_LINKS<<EOF" >> "$GITHUB_ENV"
        echo "${{ inputs.links }}" >> "$GITHUB_ENV"
        echo "EOF" >> "$GITHUB_ENV"

    - name: Run download script with input
      env:
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
        # Живой прогресс в логе шага, без блочной буферизации stdout (см. комментарий
        # в download.py рядом с sys.stdout.reconfigure - это то же самое, но раньше:
        # отключает буферизацию ДО того, как интерпретатор вообще начал выполнять код).
        PYTHONUNBUFFERED: "1"
        # Раунд 5: не-LOC скачивания теперь идут через ThreadPoolExecutor - см. блок
        # "Раунд 5" в начале download.py. Оставлены как env, а не хардкод в коде, чтобы
        # подкрутить без правки скрипта, если после прогона на полном файле вылезут
        # 429 у pexels/pixabay (общий ключ, риск отдельно обсуждался) - тогда снизить
        # DOWNLOAD_PEXELS_PIXABAY_CONCURRENCY, не трогая остальной пул.
        # DOWNLOAD_CONCURRENCY: "8"
        # DOWNLOAD_PEXELS_PIXABAY_CONCURRENCY: "3"
        # DOWNLOAD_WIKIMEDIA_MIN_INTERVAL_SECONDS: "1.5"
      run: python download.py

    # download.py пишет download_failed.txt ТОЛЬКО если что-то реально не скачалось
    # (см. write_failed_report в download.py). Здесь их номера подмешиваются в
    # missing.txt - если search_media не запускался (сценарий с ручными ссылками),
    # missing.txt ещё не существует, поэтому сначала touch, чтобы шаг не падал.
    - name: Merge failed downloads into missing.txt
      run: |
        touch missing.txt
        if [ -s download_failed.txt ]; then
          cut -d: -f1 download_failed.txt >> missing.txt
        fi
        sort -n -u -o missing.txt missing.txt

    - name: Show download failures summary
      run: |
        if [ -s download_failed.txt ]; then
          echo "## Ошибки скачивания (номер найден поиском, но файл не скачался)" >> "$GITHUB_STEP_SUMMARY"
          echo "Количество: $(wc -l < download_failed.txt)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat download_failed.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Publish files as a GitHub Release
      id: release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="media-${{ github.run_id }}"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

        gh release create "$TAG" \
          --repo "${{ github.repository }}" \
          --title "Медиафайлы от $(date -u +'%Y-%m-%d %H:%M UTC')" \
          --notes "Автоматическая публикация из workflow. Файлов: $(ls downloaded_media | wc -l)"

        gh release upload "$TAG" downloaded_media/* \
          --repo "${{ github.repository }}" \
          --clobber

        # missing.txt (уже объединённый с провалами download.py) прикладываем всегда -
        # даже пустой файл полезен как явное подтверждение "пропущенных нет". А вот
        # download_failed.txt - только если он реально не пуст, чтобы не тащить в
        # релиз шум, когда скачивание прошло без единого сбоя.
        UPLOAD_EXTRA="missing.txt"
        if [ -s download_failed.txt ]; then
          UPLOAD_EXTRA="$UPLOAD_EXTRA download_failed.txt"
        fi
        gh release upload "$TAG" $UPLOAD_EXTRA \
          --repo "${{ github.repository }}" \
          --clobber

    - name: Build direct-links list for download manager
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="${{ steps.release.outputs.tag }}"
        > release_links.txt
        for f in downloaded_media/*; do
          filename=$(basename "$f")
          echo "https://github.com/${{ github.repository }}/releases/download/$TAG/$filename" >> release_links.txt
        done
        cat release_links.txt

        gh release upload "$TAG" release_links.txt \
          --repo "${{ github.repository }}" \
          --clobber

    - name: Print release URL
      run: |
        echo "Релиз со всеми файлами:"
        echo "https://github.com/${{ github.repository }}/releases/tag/${{ steps.release.outputs.tag }}"
        
