name: Download Media Archive

on:
  workflow_dispatch:
    inputs:
      links:
        description: 'Вставь СЮДА весь объединенный список ссылок от Клода'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Download Tools with Impersonation
      run: |
        pip install -U "yt-dlp[default,curl-cffi]" cloudscraper

    - name: Run download script with input
      env:
        INPUT_LINKS: ${{ inputs.links }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      run: python download.py

    - name: Upload downloaded media
      uses: actions/upload-artifact@v4
      with:
        name: media_archive
        path: downloaded_media/
        retention-days: 1
