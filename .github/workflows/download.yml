name: Download Media Archive
on:
  workflow_dispatch:
    inputs:
      srt_path:
        description: 'Путь к SRT-файлу в репозитории (для генерации поисковых запросов через Gemini, а затем автоматического подбора медиа через search.py). Оставь пустым, если сейчас не нужно.'
        required: false
        type: string
      links:
        description: 'Вставь СЮДА готовый список ссылок вручную (обходит generate_queries/search.py). Оставь пустым, если сейчас не нужно.'
        required: false
        type: string

permissions:
  contents: write   # нужно, чтобы workflow мог создавать Release

jobs:
  # -------------------------------------------------------------------------
  # Шаг 1: SRT -> requests.json через Gemini (structured output).
  # Запускается, только если при ручном триггере заполнено поле srt_path.
  # -------------------------------------------------------------------------
  generate_queries:
    if: ${{ inputs.srt_path != '' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install query-generation deps
      run: pip install -U google-genai

    # Чекпоинт между запусками: если прошлый прогон упал (квота/сбой Gemini), подтягиваем
    # его из кэша (тот же SRT -> тот же хэш), и генерация продолжится с прерванного места.
    # Для другого SRT/содержимого префикс не совпадёт, а скрипт дополнительно сверяет хэш.
    - name: Compute SRT hash for checkpoint cache key
      id: srt_hash
      env:
        SRT_PATH: ${{ inputs.srt_path }}
      run: echo "value=$(sha256sum "$SRT_PATH" | cut -c1-32)" >> "$GITHUB_OUTPUT"

    - name: Restore Gemini checkpoint from previous run
      uses: actions/cache/restore@v5
      with:
        path: requests.json.checkpoint.json
        key: genq-checkpoint-${{ steps.srt_hash.outputs.value }}-${{ github.run_id }}
        restore-keys: genq-checkpoint-${{ steps.srt_hash.outputs.value }}-

    - name: Generate search queries via Gemini
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GENQ_HTTP_TIMEOUT_SECONDS: "180"
        PYTHONUNBUFFERED: "1"
      run: python generate_queries.py --input "${{ inputs.srt_path }}" --output requests.json

    # При успехе скрипт сам удаляет чекпоинт, поэтому сохраняем его только при падении шага.
    - name: Save Gemini checkpoint (only if generation failed)
      if: failure()
      uses: actions/cache/save@v5
      with:
        path: requests.json.checkpoint.json
        key: genq-checkpoint-${{ steps.srt_hash.outputs.value }}-${{ github.run_id }}

    - name: Upload requests.json as artifact
      uses: actions/upload-artifact@v6
      with:
        name: requests-json
        path: requests.json
        retention-days: 14

  # -------------------------------------------------------------------------
  # Шаг 2: requests.json -> links.txt/missing.txt через search.py.
  # Запускается автоматически следом за generate_queries (тот же ручной триггер
  # через srt_path), отдельным job'ом - чтобы CLIP/torch ставились и кэшировались
  # только тогда, когда реально нужны.
  # -------------------------------------------------------------------------
  search_media:
    needs: generate_queries
    if: ${{ !cancelled() && inputs.srt_path != '' && needs.generate_queries.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      SEARCH_CLIP_MODEL: "ViT-B-32-quickgelu"
      SEARCH_CLIP_PRETRAINED: "openai"
      PYTHONUNBUFFERED: "1"
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Download requests.json artifact
      uses: actions/download-artifact@v7
      with:
        name: requests-json

    # Кэш весов CLIP (open_clip тянет их через huggingface_hub) - без кэша каждый
    # запуск заново качает ~350МБ для ViT-B-32-quickgelu. Ключ включает модель/pretrained,
    # чтобы смена SEARCH_CLIP_MODEL/_PRETRAINED не подсунула чужой кэш.
    - name: Cache CLIP weights
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/huggingface
          ~/.cache/clip
          ~/.cache/torch
        key: clip-weights-${{ runner.os }}-${{ env.SEARCH_CLIP_MODEL || 'ViT-B-32-quickgelu' }}-${{ env.SEARCH_CLIP_PRETRAINED || 'openai' }}

    - name: Install search deps (CPU-only torch/torchvision first, чтобы не тянуть CUDA-сборку)
      run: |
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install aiohttp pillow open_clip_torch

    - name: Run search.py
      env:
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        SEARCH_CLIP_MODEL: ${{ env.SEARCH_CLIP_MODEL || 'ViT-B-32-quickgelu' }}
        SEARCH_CLIP_PRETRAINED: ${{ env.SEARCH_CLIP_PRETRAINED || 'openai' }}
        # Опциональная тонкая настройка параметров поиска и лимитеров (Этап 1):
        # SEARCH_SIM_MIN_THRESHOLD: "0.21"
        # SEARCH_SIM_ACCEPT_THRESHOLD: "0.30"
        # SEARCH_LOC_MIN_INTERVAL_SECONDS: "3.2"
        # SEARCH_LOC_TIMEOUT_SECONDS: "30"
        # SEARCH_WIKIMEDIA_PREVIEW_MIN_INTERVAL_SECONDS: "0.35"
        # SEARCH_WIKIMEDIA_PREVIEW_CONCURRENCY: "3"
      run: >
        python search.py --input requests.json --links-output links.txt
        --backup-links-output backup_links.txt --missing-output missing.txt
        --backup-missing-output backup_missing.txt

    - name: Show missing segments summary
      run: |
        echo "## Пропущенные сегменты (ничего не найдено)" >> "$GITHUB_STEP_SUMMARY"
        if [ -s missing.txt ]; then
          echo "Количество: $(wc -l < missing.txt)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat missing.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Нет пропущенных сегментов." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload links.txt / backup_links.txt / missing.txt / backup_missing.txt as artifact
      uses: actions/upload-artifact@v6
      with:
        name: search-links
        path: |
          links.txt
          backup_links.txt
          missing.txt
          backup_missing.txt
        retention-days: 14

  # -------------------------------------------------------------------------
  # Шаг 3: готовые ссылки -> скачивание -> GitHub Release.
  # Источник ссылок: либо артефакт от search_media (когда запуск шёл через
  # srt_path), либо ручной ввод inputs.links (старый сценарий, без изменений).
  #
  # links.txt используется ЗДЕСЬ ТОЛЬКО как временный вход для download.py (через
  # INPUT_LINKS) - в релиз он не публикуется и артефактом до конца прогона не
  # является (это осознанно: он не нужен никому после того, как файлы скачаны).
  # Наружу (в релиз) идут missing.txt - объединённый список номеров, для которых
  # так ничего и не удалось получить: те, что не нашёл search.py, ПЛЮС те, что
  # search.py нашёл, но download.py не смог скачать (см. шаг "Merge failed
  # downloads into missing.txt" и download_failed.txt в download.py) - и,
  # отдельно, download_failed.txt (только если реально что-то не скачалось).
  # -------------------------------------------------------------------------
  download:
    needs: search_media
    if: ${{ !cancelled() && (inputs.links != '' || needs.search_media.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install Download Tools with Impersonation
      run: |
        pip install -U "yt-dlp[default,curl-cffi]" cloudscraper

    - name: Download search-links artifact (если ссылки пришли из search.py)
      if: needs.search_media.result == 'success'
      uses: actions/download-artifact@v7
      with:
        name: search-links

    - name: Load INPUT_LINKS / INPUT_BACKUP_LINKS from search.py output
      if: needs.search_media.result == 'success'
      run: |
        echo "INPUT_LINKS<<EOF" >> "$GITHUB_ENV"
        cat links.txt >> "$GITHUB_ENV"
        echo "EOF" >> "$GITHUB_ENV"

        echo "INPUT_BACKUP_LINKS<<EOF" >> "$GITHUB_ENV"
        cat backup_links.txt >> "$GITHUB_ENV"
        echo "EOF" >> "$GITHUB_ENV"

    - name: Load INPUT_LINKS from manual input (старый сценарий, без backup)
      if: needs.search_media.result != 'success'
      run: |
        echo "INPUT_LINKS<<EOF" >> "$GITHUB_ENV"
        echo "${{ inputs.links }}" >> "$GITHUB_ENV"
        echo "EOF" >> "$GITHUB_ENV"
        # INPUT_BACKUP_LINKS сознательно не задаётся - в сценарии с ручными
        # ссылками backup-файла просто не существует (search.py не запускался).
        # download.py трактует отсутствующую/пустую INPUT_BACKUP_LINKS как
        # "backup ни для одного номера нет" - это нормальный случай.

    - name: Run download script with input
      env:
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
        # Живой прогресс в логе шага, без блочной буферизации stdout (см. комментарий
        # в download.py рядом с sys.stdout.reconfigure - это то же самое, но раньше:
        # отключает буферизацию ДО того, как интерпретатор вообще начал выполнять код).
        PYTHONUNBUFFERED: "1"
        # Раунд 5 и Раунд 10 (Этап 2): не-LOC скачивания идут через ThreadPoolExecutor,
        # а все запросы к LOC (метаданные и файлы) защищены единым rate-limiter'ом
        # (DOWNLOAD_LOC_MIN_INTERVAL_SECONDS=3.2с от момента ЗАВЕРШЕНИЯ прошлого сетевого
        # запроса) и мьютексом _loc_lock (concurrency=1). Разделение интервалов из Раунда 7
        # отменено, чтобы исключить всплески запросов и бан Cloudflare (см. download.py).
        # Оставлены как env, а не хардкод в коде, для удобной подстройки при необходимости:
        # DOWNLOAD_CONCURRENCY: "8"
        # DOWNLOAD_PEXELS_PIXABAY_CONCURRENCY: "3"
        # DOWNLOAD_WIKIMEDIA_MIN_INTERVAL_SECONDS: "0.25"
        # DOWNLOAD_WIKIMEDIA_CONCURRENCY: "2"
        # DOWNLOAD_LOC_MIN_INTERVAL_SECONDS: "3.2"
        # DOWNLOAD_LOC_RETRIES: "3"
      run: python download.py

    # download.py пишет download_failed.txt ТОЛЬКО если что-то реально не скачалось
    # (см. write_failed_report в download.py). Здесь их номера подмешиваются в
    # missing.txt - если search_media не запускался (сценарий с ручными ссылками),
    # missing.txt ещё не существует, поэтому сначала touch, чтобы шаг не падал.
    #
    # Раунд 8: если после merge файл остаётся полностью пустым (нет пропущенных
    # search.py, нет провалов download.py - именно такой прогон и вскрыл баг),
    # подставляем одну явную строку-заглушку вместо оставления файла 0 байт. Не
    # просто на всякий случай: GitHub REST API для загрузки release-ассетов
    # (uploads.github.com) отвечает 400 "Bad Content-Length" именно на буквально
    # 0-байтные файлы - это подтверждено реальным прогоном (см. обсуждение), шаг
    # "Publish files as a GitHub Release" падал на строке gh release upload
    # "$TAG" $UPLOAD_EXTRA именно на missing.txt, при том что download_failed.txt
    # в этом же прогоне не создавался вовсе (0 провалов) - т.е. единственная
    # причина падения технический нюанс API, а не что-то в generate_queries.py/
    # search.py/download.py. Заглушка сохраняет исходный замысел ("пустой файл -
    # тоже полезное явное подтверждение") без 0-байтного тела запроса.
    - name: Merge failed downloads into missing.txt
      run: |
        touch missing.txt
        if [ -s download_failed.txt ]; then
          cut -d: -f1 download_failed.txt >> missing.txt
        fi
        sort -n -u -o missing.txt missing.txt
        if [ ! -s missing.txt ]; then
          echo "Пропущенных сегментов нет - все найдены и успешно скачаны." > missing.txt
        fi

    - name: Show download failures summary
      run: |
        if [ -s download_failed.txt ]; then
          echo "## Ошибки скачивания (номер найден поиском, но файл не скачался)" >> "$GITHUB_STEP_SUMMARY"
          echo "Количество: $(wc -l < download_failed.txt)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat download_failed.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Publish files as a GitHub Release
      id: release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="media-${{ github.run_id }}"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

        gh release create "$TAG" \
          --repo "${{ github.repository }}" \
          --title "Медиафайлы от $(date -u +'%Y-%m-%d %H:%M UTC')" \
          --notes "Автоматическая публикация из workflow. Файлов: $(ls downloaded_media | wc -l)"

        if ls downloaded_media/* 1> /dev/null 2>&1; then
          gh release upload "$TAG" downloaded_media/* \
            --repo "${{ github.repository }}" \
            --clobber
        fi

        # missing.txt прикладываем всегда - после Раунда 8 он гарантированно не 0
        # байт (см. шаг "Merge failed downloads into missing.txt": либо реальный
        # список пропущенных номеров, либо явная строка-заглушка "пропущенных нет"),
        # так что 400 "Bad Content-Length" от uploads.github.com на пустое тело
        # здесь больше не воспроизводится. download_failed.txt - только если он
        # реально не пуст, чтобы не тащить в релиз шум, когда скачивание прошло без
        # единого сбоя (этот файл по-прежнему может быть 0 байт/не существовать -
        # для него сохранена проверка [ -s ... ], т.к. его в релиз тогда не грузим
        # вообще, в отличие от missing.txt).
        UPLOAD_EXTRA="missing.txt"
        if [ -s download_failed.txt ]; then
          UPLOAD_EXTRA="$UPLOAD_EXTRA download_failed.txt"
        fi
        gh release upload "$TAG" $UPLOAD_EXTRA \
          --repo "${{ github.repository }}" \
          --clobber

    - name: Build direct-links list for download manager
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="${{ steps.release.outputs.tag }}"
        > release_links.txt
        for f in downloaded_media/*; do
          [ -e "$f" ] || continue
          filename=$(basename "$f")
          echo "https://github.com/${{ github.repository }}/releases/download/$TAG/$filename" >> release_links.txt
        done
        cat release_links.txt

        gh release upload "$TAG" release_links.txt \
          --repo "${{ github.repository }}" \
          --clobber

    - name: Print release URL
      run: |
        echo "Релиз со всеми файлами:"
        echo "https://github.com/${{ github.repository }}/releases/tag/${{ steps.release.outputs.tag }}"
