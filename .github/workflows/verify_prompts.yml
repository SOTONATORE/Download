# .github/workflows/verify_prompts.yml
name: Verify prompts

# Бесплатная изолированная проверка генерации промптов для выбранного семейства текстовой модели
# (gemini, gemma, nemotron, nemotron-super-vl; провайдер берётся из config.default.yaml).
# Тот же путь подготовки промптов, что у generate.yml (cli.prepare_prompts_only -> build_prompts),
# но без аренды видеокарт, без Vast.ai и без релиза. Ключ Vast.ai не нужен.
on:
  workflow_dispatch:
    inputs:
      srt_path:
        description: "Путь к файлу SRT"
        type: string
        default: "final.srt"
      missing_path:
        description: "Путь к файлу missing"
        type: string
        default: "missing.txt"
      video_profile:
        description: "Видео-модель: ltx25 = видео проверяется; none = видео не проверяется. Варианты сверяются с профилями без поля type (видео)"
        type: choice
        options:
          - "ltx25"
          - "none"
        default: "ltx25"
      photo_profile:
        description: "Фото-модель: zimage_turbo = фото проверяется; none = фото не проверяется. Варианты сверяются с профилями type: image"
        type: choice
        options:
          - "zimage_turbo"
          - "none"
        default: "none"
      video_percent:
        description: "Доля видео, %: какая часть хронометража (по секундам) идёт в видео, остальное в фото. Целое число от 0 до 100"
        type: number
        default: 100
      intro_seconds:
        description: "Вступление, сек: сегменты с начала ролика всегда идут в видео, даже сверх бюджета video_percent"
        type: number
        default: 10
      limit_clips:
        # GitHub Actions не поддерживает type: integer, поэтому number
        description: "0 = все клипы из missing; N > 0 = первые N клипов по возрастанию номера"
        type: number
        default: 3
      preset:
        description: "Пресет промптов: none = без пресета; другое значение = файл Generate/model_profiles/presets/prompts/<имя>.md, проверяется до аренды карт (новые пресеты добавляются в список choices)"
        type: choice
        options:
          - "none"
          - "test"
        default: "none"
      text_model:
        description: "Семейство текстовой модели для промптов: nemotron-super-vl (по умолчанию), gemini, gemma или nemotron"
        type: choice
        options:
          - "nemotron-super-vl"
          - "gemini"
          - "gemma"
          - "nemotron"
        default: "nemotron-super-vl"

concurrency:
  group: verify-gemini
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Получение репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка зависимостей
        run: pip install -r Generate/requirements-dev.txt

      # Входы передаются через env, а не подстановкой в текст скрипта (SPEC 0.2).
      # Имена env совпадают с generate.yml; значения выбора профилей выводятся так же, как там.
      - name: Проверка генерации промптов
        env:
          GEMINI1: ${{ secrets.GEMINI1 }}
          GEMINI2: ${{ secrets.GEMINI2 }}
          GEMINI3: ${{ secrets.GEMINI3 }}
          GEMINI4: ${{ secrets.GEMINI4 }}
          GEMINI5: ${{ secrets.GEMINI5 }}
          GEMINI6: ${{ secrets.GEMINI6 }}
          GEMINI7: ${{ secrets.GEMINI7 }}
          GEMINI8: ${{ secrets.GEMINI8 }}
          GEMINI9: ${{ secrets.GEMINI9 }}
          GEMINI10: ${{ secrets.GEMINI10 }}
          OPENROUTER1: ${{ secrets.OPENROUTER1 }}
          OPENROUTER2: ${{ secrets.OPENROUTER2 }}
          OPENROUTER3: ${{ secrets.OPENROUTER3 }}
          OPENROUTER4: ${{ secrets.OPENROUTER4 }}
          OPENROUTER5: ${{ secrets.OPENROUTER5 }}
          OPENROUTER6: ${{ secrets.OPENROUTER6 }}
          OPENROUTER7: ${{ secrets.OPENROUTER7 }}
          OPENROUTER8: ${{ secrets.OPENROUTER8 }}
          OPENROUTER9: ${{ secrets.OPENROUTER9 }}
          OPENROUTER10: ${{ secrets.OPENROUTER10 }}
          SRT_PATH: ${{ inputs.srt_path }}
          MISSING_PATH: ${{ inputs.missing_path }}
          # выбор моделей (none = модель выключена), как в generate.yml
          VIDEO_MODEL: ${{ inputs.video_profile }}
          PHOTO_MODEL: ${{ inputs.photo_profile }}
          # профиль видео: при none запасной ltx25 (как в generate.yml); профиль фото: пусто при none
          VIDEO_PROFILE: ${{ inputs.video_profile != 'none' && inputs.video_profile || 'ltx25' }}
          PHOTO_PROFILE: ${{ inputs.photo_profile != 'none' && inputs.photo_profile || '' }}
          VIDEO_PERCENT: ${{ inputs.video_percent }}
          INTRO_SECONDS: ${{ inputs.intro_seconds }}
          LIMIT_CLIPS: ${{ inputs.limit_clips }}
          PRESET: ${{ inputs.preset }}
          TEXT_MODEL: ${{ inputs.text_model }}
          # Журнал как у generate.yml (SPEC 10): файл <каталог артефакта>/run/debug.log на уровне GEN_LOG_LEVEL.
          # Все файлы проверки лежат в одном каталоге артефакта.
          ART_DIR: verify-artifact
          PROMPTS_PATH: verify-artifact/prompts.json
          GEN_LOG_LEVEL: "DEBUG"
        run: |
          python - <<'PY'
          import argparse
          import importlib
          import json
          import logging
          import os
          import sys

          # Имена секретов: GEMINI1…GEMINI10 (как в gemini_pool.py) и OPENROUTER1…OPENROUTER10
          # (как в openrouter_transport.py); значения не выводятся
          GEMINI_NAMES = ("GEMINI1", "GEMINI2", "GEMINI3", "GEMINI4", "GEMINI5",
                          "GEMINI6", "GEMINI7", "GEMINI8", "GEMINI9", "GEMINI10")
          OPENROUTER_NAMES = tuple(f"OPENROUTER{i}" for i in range(1, 11))
          # Маскируются только значения длиной не меньше MASK_MIN_LEN (оба набора). Короче — не маскируются:
          # выводится предупреждение без значения. Длина каждого непустого секрета печатается один раз.
          MASK_MIN_LEN = 20
          secret_all = {k: os.environ.get(k, "").strip() for k in GEMINI_NAMES + OPENROUTER_NAMES}
          for k, value in secret_all.items():
              if value:
                  print(f"{k}: длина {len(value)}")
                  if len(value) < MASK_MIN_LEN:
                      print(f"Секрет {k} короче {MASK_MIN_LEN} символов (длина {len(value)}): маскировка для него пропущена, проверьте значение в настройках репозитория.")
          secret_values = sorted({v for v in secret_all.values() if len(v) >= MASK_MIN_LEN}, key=len, reverse=True)
          SUMMARY = os.environ.get("GITHUB_STEP_SUMMARY")


          def mask(text) -> str:
              text = str(text)
              for value in secret_values:
                  text = text.replace(value, "***")
              return text


          def say(text: str = "") -> None:
              print(mask(text))


          def summary(text: str = "") -> None:
              if SUMMARY:
                  with open(SUMMARY, "a", encoding="utf-8") as fh:
                      fh.write(mask(text) + "\n")


          def fail(text: str) -> None:
              say("ОШИБКА: " + text)
              summary("## Проверка промптов: ОШИБКА\n\n" + text)
              sys.exit(1)


          def find_symbol(name, modules):
              for prefix in ("Generate.core.", "core.", ""):
                  for mod in modules:
                      try:
                          module = importlib.import_module(prefix + mod)
                      except ImportError:
                          continue
                      obj = getattr(module, name, None)
                      if obj is not None:
                          return obj
              return None


          # Семейство текстовой модели: провайдер из config.default.yaml, как у cli (resolve_text_family).
          # Проверяются ключи только провайдера семейства; для gemini это GEMINI1…GEMINI10, как раньше.
          from Generate.core.config_loader import load_config
          try:
              cfg = load_config()
          except Exception as exc:  # noqa: BLE001
              fail("не удалось прочитать config.default.yaml: " + type(exc).__name__ + ": " + mask(exc))
          family = os.environ.get("TEXT_MODEL", "").strip() or cfg.default_text_model
          spec = cfg.text_model_families.get(family)
          if spec is None:
              fail("неизвестное семейство текстовой модели: " + family)
          if spec["provider"] == "openrouter":
              KEY_NAMES, KEY_HINT, KEY_LABEL = OPENROUTER_NAMES, "OPENROUTER1…OPENROUTER10", "OpenRouter"
          else:
              KEY_NAMES, KEY_HINT, KEY_LABEL = GEMINI_NAMES, "GEMINI1…GEMINI10", "Gemini"
          family_values = sorted({os.environ.get(k, "").strip() for k in KEY_NAMES} - {""}, key=len, reverse=True)
          if not family_values:
              fail(f"ни один из ключей {KEY_HINT} не задан в настройках репозитория")
          say(f"Найдено ключей {KEY_LABEL}: {len(family_values)}")

          # Журнал как в cli.py: консоль и файл <ART_DIR>/run/debug.log на уровне GEN_LOG_LEVEL (пусто = INFO).
          log_level = os.environ.get("GEN_LOG_LEVEL", "").strip() or "INFO"
          if log_level not in ("INFO", "DEBUG"):
              fail("GEN_LOG_LEVEL допускает только значения INFO и DEBUG")
          art_dir = os.environ.get("ART_DIR", "").strip() or None
          setup_logging = find_symbol("setup_logging", ("log_setup",))
          set_known_secrets = find_symbol("set_known_secrets", ("log_setup",))
          if setup_logging is None:
              fail("в проекте не найден символ setup_logging")
          if set_known_secrets is not None:
              set_known_secrets(secret_values)  # ключи маскируются в журнале даже без имени (log_setup.py)
          # HTTP-библиотеки на DEBUG оставляем на WARNING, как в cli.py
          for noisy in ("httpx", "httpcore", "urllib3"):
              logging.getLogger(noisy).setLevel(logging.WARNING)
          if art_dir:
              os.makedirs(art_dir, exist_ok=True)
          handlers, log_note = setup_logging(log_level, art_dir)
          if log_note:
              say(log_note)

          video_model = os.environ["VIDEO_MODEL"]
          photo_model = os.environ["PHOTO_MODEL"]
          if video_model == "none" and photo_model == "none":
              fail("видео и фото выключены: проверять нечего")
          for name in ("SRT_PATH", "MISSING_PATH"):
              path = os.environ[name]
              if not os.path.isfile(path):
                  fail(f"файл не найден: {path}")

          try:
              limit = int(float(os.environ.get("LIMIT_CLIPS") or 0))
          except ValueError:
              fail("limit_clips должен быть числом")

          # Тот же путь, что у cli run: профили, пресет, распределение, промпты (без Vast и релиза).
          from Generate.cli import prepare_prompts_only

          ns = argparse.Namespace(
              srt=os.environ["SRT_PATH"],
              missing=os.environ["MISSING_PATH"],
              prompts_path=os.environ["PROMPTS_PATH"],
              artifact_dir=art_dir,
              video_model=video_model,
              video_profile=os.environ["VIDEO_PROFILE"],
              photo_profile=os.environ.get("PHOTO_PROFILE") or None,
              video_percent=os.environ.get("VIDEO_PERCENT") or "100",
              intro_seconds=os.environ.get("INTRO_SECONDS") or "10",
              limit_clips=limit,
              preset=os.environ.get("PRESET") or "none",
              text_model=os.environ.get("TEXT_MODEL") or None,
          )
          try:
              prep = prepare_prompts_only(ns)
          except Exception as exc:  # noqa: BLE001
              fail("подготовка промптов не удалась: " + type(exc).__name__ + ": " + mask(exc))

          # Распределение по всему хронометражу берётся из distribution.json (записан до лимита), а не из выборки.
          from Generate.core.segment_split import WINDOW_SECONDS

          dist_file = os.path.join(art_dir, "distribution.json")
          if not os.path.isfile(dist_file):
              fail("распределение не найдено: " + dist_file)
          with open(dist_file, encoding="utf-8") as fh:
              dist_segments = json.load(fh)["segments"]
          split_video = sum(1 for r in dist_segments if r["mode"] == "video")
          split_photo = len(dist_segments) - split_video
          per_window = {}
          for r in dist_segments:
              counts = per_window.setdefault(int(r["start"] // WINDOW_SECONDS), [0, 0])
              counts[0 if r["mode"] == "video" else 1] += 1
          zero_video = sum(1 for n_video, _ in per_window.values() if n_video == 0)
          zero_photo = sum(1 for _, n_photo in per_window.values() if n_photo == 0)
          extra = [
              f"- Распределение по всему хронометражу: видео {split_video}, фото {split_photo} сегментов",
              f"- Проверено в выборке: видео {len(prep.video_nums)}, фото {len(prep.photo_nums)} сегментов",
              f"- Окон {WINDOW_SECONDS} с без видео: {zero_video}, окон без фото: {zero_photo}",
          ]
          lines = prep.report_md.splitlines()
          at = next(i for i, text in enumerate(lines) if text.startswith("- Видео-сегментов:")) + 1
          report_md = "\n".join(lines[:at] + extra + lines[at:]) + "\n"

          with open(os.path.join(art_dir, "report.md"), "w", encoding="utf-8") as fh:
              fh.write(mask(report_md))
          summary(report_md)
          for line in report_md.splitlines():
              say(line)

          if prep.problems or prep.failures:
              for p in prep.problems:
                  say("ПРОБЛЕМА: " + p)
              sys.exit(1)
          say(f"Проверка пройдена: промптов {len(prep.missing)}")
          PY

      - name: Загрузка prompts.json, distribution.json, отчёта и журнала
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-prompts-files
          # все файлы проверки лежат в каталоге verify-artifact; run/debug.log — журнал проверки
          path: |
            verify-artifact/prompts.json
            verify-artifact/distribution.json
            verify-artifact/report.md
            verify-artifact/run/debug.log
