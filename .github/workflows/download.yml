name: Download Media Archive

on:
  workflow_dispatch:
    inputs:
      links:
        description: 'Вставь СЮДА весь объединенный список ссылок от Клода'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Download Tools with Impersonation
      run: |
        pip install -U "yt-dlp[default,curl-cffi]"

    - name: Diagnose Pexels API key
      env:
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      run: |
        echo "Длина ключа (символов): ${#PEXELS_API_KEY}"
        echo "--- Проверка с обычным User-Agent (как curl) ---"
        curl -s -o /tmp/pexels_test.json -w "HTTP статус: %{http_code}\n" \
          -H "Authorization: ${PEXELS_API_KEY}" \
          "https://api.pexels.com/v1/videos/videos/7947467"
        echo "Тело ответа:"
        cat /tmp/pexels_test.json
        echo ""
        echo "--- Проверка с User-Agent как у Python urllib по умолчанию ---"
        curl -s -o /tmp/pexels_test2.json -w "HTTP статус: %{http_code}\n" \
          -H "Authorization: ${PEXELS_API_KEY}" \
          -H "User-Agent: Python-urllib/3.12" \
          "https://api.pexels.com/v1/videos/videos/7947467"
        echo "Тело ответа:"
        cat /tmp/pexels_test2.json

    - name: Run download script with input
      env:
        INPUT_LINKS: ${{ inputs.links }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      run: python download.py

    - name: Archive downloaded media
      run: |
        zip -r media_archive.zip downloaded_media

    - name: Upload zip artifact
      uses: actions/upload-artifact@v4
      with:
        name: media_archive
        path: media_archive.zip
        retention-days: 1
