max_characters: 4
animals_count: true
small_objects: allowed
speech: forbidden
weapons: forbidden
scene_motion_wording: drop
close_faces: forbidden
static_frame: true
emotion: posture_and_action
subject_source: text_only
horses_vehicles_animals_max: 3
children: forbidden
object_sets: forbidden
allowed_shot_items: letter, map, diagram, chart, infographic, calendar, spreadsheet, newspaper, document, paper, blank sheet, sheet of paper, lettering
# Disabled so the system prompt does not force sketchy wobbly pen strokes instead of clean 2D comic outlines.
sketch_style: false
# Disabled so clean comic ink and rounded white callout or title borders do not trigger false-positive rework.
forbid_thick_vector: false
dangling_text_check: true
# Disabled so campfire, stove and flame scenes do not trigger false-positive rework or hands-away-from-fire loops.
fire_hands: allowed