name: probe-gemini
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe generateContent and interactions
        env:
          GEMINI_API_KEY: ${{ secrets.GEN_GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          KEY = os.environ["GEMINI_API_KEY"]
          BASE = "https://generativelanguage.googleapis.com/v1beta"
          SCHEMA = {"type": "object", "properties": {"ok": {"type": "boolean"}}, "required": ["ok"]}

          def call(url, body):
              req = urllib.request.Request(url, json.dumps(body).encode(),
                  {"x-goog-api-key": KEY, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, r.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()

          def gen(model):
              return call(f"{BASE}/models/{model}:generateContent", {
                  "contents": [{"parts": [{"text": "Return JSON with ok=true"}]}],
                  "generationConfig": {"responseMimeType": "application/json",
                                       "responseJsonSchema": SCHEMA}})

          def inter(model):
              return call(f"{BASE}/interactions", {
                  "model": model, "input": "Return JSON with ok=true",
                  "response_format": {"type": "text", "mime_type": "application/json",
                                      "schema": SCHEMA}})

          for name, fn in (("generateContent", gen), ("interactions", inter)):
              for model in ("gemini-3.5-flash-lite", "gemini-nonexistent-xyz"):
                  status, body = fn(model)
                  print(f"=== {name} | {model} | HTTP {status}\n{body[:1500]}\n")
          PY
