# Значения по умолчанию для второй части (SPEC.md, раздел 3).
# Приоритет слоёв (снизу вверх растёт): этот файл -> входы workflow (аргументы CLI) -> секреты из окружения.
# Секретов в этом файле нет и быть не должно: GEN_GEMINI_API_KEY и GEN_VAST_API_KEY
# читаются только из переменных окружения (SPEC 0.1).
# Загрузка и проверка схемы: Generate/core/config_loader.py. Неизвестный, пропущенный ключ,
# неверный тип или выход за границы = ошибка (код выхода 2), все проблемы выводятся разом.
# Все ключи обязательны: файл является единственным источником значений по умолчанию.

# --- Имена файлов и текст ---
# Шаблон имени файла клипа; {num} оформляется по clip_name_width.
filename_template: "{num}.mp4"
# Ширина номера в имени файла: 0 = без ведущих нулей (как в первой части).
clip_name_width: 0
# Общее описание стиля/мира; можно задать входом workflow.
style_brief: ""

# --- Gemini ---
# Цепочка моделей по порядку: основная Gemini 3.5 Flash Lite, запасная 3.1 Flash Lite.
# Переход на следующую модель только при исчерпании суточной квоты.
gemini_models:
  - "gemini-3.5-flash-lite"
  - "gemini-3.1-flash-lite"
# Сегментов в одном пакете запроса.
gemini_batch_size: 100
# Лимиты для активной модели; значения даны пользователем, сверить с документацией Google на этапе 4.
gemini_rpm_limit: 15       # запросов в минуту
gemini_tpm_limit: 250000   # токенов в минуту
gemini_rpd_limit: 500      # запросов в сутки на ОДНУ модель

# --- Профиль модели и тайминги ---
# Файл из Generate/model_profiles/ (без расширения).
model_profile: ltx25
fps: 24
# Короче этого значения: предупреждение.
clip_min_sec: 2.5
# Мягкий потолок длины клипа (раздел 6).
clip_max_sec: 5.0
# Максимум, который тянет карта: берётся из профиля модели (значение здесь не задаётся).
# Выше него: запись в лог, без остановки.
gpu_max_sec: null
tail_pad_sec: 0.5
# Итоговый размер кадра. Значение владеет профилем модели (model_profiles/<имя>.yaml, нода ImageScale);
# здесь дублируется для проверки и документации, код его из конфига не использует.
target_resolution: "1920x1080"

# --- Аренда карт Vast.ai ---
# Модель видеокарты, которую ищем в предложениях Vast.ai (точное имя, как в каталоге Vast).
# Предложения с другими картами отбрасываются ещё на этапе поиска.
gpu_name: "RTX 5090"
# Прерываемая аренда (interruptible / spot): дешевле, но хост может забрать карту.
interruptible: true
# Нижняя граница цены, USD/час. Слишком дешёвые предложения почти всегда оказываются
# нерабочими хостами (сбои, обрывы, «мёртвые» машины), поэтому всё ниже этого порога отсекается.
min_price_per_hour: 0.35
# Верхний потолок цены, USD/час. Предложения дороже этого значения не рассматриваются.
# Должен быть строго больше min_price_per_hour (проверка схемы).
max_price_per_hour: 0.55
# Минимальная надёжность хоста (0..1). Предложения с рейтингом ниже отбрасываются.
min_reliability: 0.95
# Минимальная скорость сети хоста, Мбит/с. Фильтр предложений Vast;
# на раннере узким местом сеть не считается.
min_inet_mbps: 800
# Верхний потолок цены трафика карты, USD за ТБ. Проверяется в обе стороны (загрузка и выгрузка).
# Предложение дороже этого значения, либо без читаемой цены трафика в ответе Vast, отбрасывается.
max_inet_price_per_tb: 4.1
# Верхний потолок числа параллельных карт; число карт растёт от нехватки времени (раздел 8).
max_cards: 4
# Жёсткий потолок расходов на запуск, USD.
budget_limit_usd: 2.0
# Минимальный баланс аккаунта Vast.ai, USD, при котором запуск стартует (предстартовая проверка).
# Ниже этого значения запуск останавливается до любых трат (Gemini и аренда карт не вызываются).
# Не меньше budget_limit_usd (проверка схемы): на запуск должно хватать всего бюджета.
min_balance_usd: 2.0
# Карта не вышла на связь после создания, минут (хватает на загрузку образа и старт ComfyUI).
silent_host_timeout_min: 20
# Образ Docker для карты (непустая строка без пробелов). Вход workflow переопределяет его.
docker_image: "ghcr.io/sotonatore/download/videogen-worker:latest"
# Диск карты, ГБ: ComfyUI + PyTorch + модели + выходные клипы.
disk_gb: 100
# Dead-man switch: карта без работы дольше этого срока уничтожает себя (раздел 8 (а)), минут.
worker_idle_timeout_min: 5
# Жёсткий потолок жизни карты (раздел 8 (б)), минут. Предложение: уточнить на пробном прогоне.
card_max_lifetime_min: 90

# --- Выдача и запуск ---
# Файлов в одном Release до перехода к -partN (раздел 9).
release_asset_limit: 900
# 0 = все номера из missing.txt; N > 0 = первые N по возрастанию (пробный прогон).
# Тайминги и контекст по-прежнему считаются по полному final.srt.
limit_clips: 0
# После этого срока оркестратор не берёт новые клипы, дозаливает готовое и завершает, минут.
# Запас до лимита job 360 мин.
job_deadline_min: 330
