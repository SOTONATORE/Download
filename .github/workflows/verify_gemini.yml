# .github/workflows/verify_gemini.yml
name: Verify Gemini

# Бесплатная изолированная проверка генерации промптов Gemini.
# Тот же путь подготовки промптов, что у generate.yml (cli.prepare_prompts_only -> build_prompts),
# но без аренды видеокарт, без Vast.ai и без релиза. Ключ Vast.ai не нужен.
on:
  workflow_dispatch:
    inputs:
      srt_path:
        description: "Путь к файлу SRT"
        type: string
        default: "final.srt"
      missing_path:
        description: "Путь к файлу missing"
        type: string
        default: "missing.txt"
      video_profile:
        description: "Видео-модель: ltx25 = видео проверяется; none = видео не проверяется. Варианты сверяются с профилями без поля type (видео)"
        type: choice
        options:
          - "ltx25"
          - "none"
        default: "ltx25"
      photo_profile:
        description: "Фото-модель: zimage_turbo = фото проверяется; none = фото не проверяется. Варианты сверяются с профилями type: image"
        type: choice
        options:
          - "zimage_turbo"
          - "none"
        default: "none"
      video_percent:
        description: "Доля видео, %: какая часть хронометража (по секундам) идёт в видео, остальное в фото. Целое число от 0 до 100"
        type: number
        default: 100
      intro_seconds:
        description: "Вступление, сек: сегменты с начала ролика всегда идут в видео, даже сверх бюджета video_percent"
        type: number
        default: 10
      limit_clips:
        # GitHub Actions не поддерживает type: integer, поэтому number
        description: "0 = все клипы из missing; N > 0 = первые N клипов по возрастанию номера"
        type: number
        default: 3
      preset:
        description: "Пресет промптов: none = без пресета; другое значение = файл Generate/model_profiles/presets/prompts/<имя>.md, проверяется до аренды карт (новые пресеты добавляются в список choices)"
        type: choice
        options:
          - "none"
          - "test"
        default: "none"

concurrency:
  group: verify-gemini
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Получение репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка зависимостей
        run: pip install -r Generate/requirements-dev.txt

      # Входы передаются через env, а не подстановкой в текст скрипта (SPEC 0.2).
      # Имена env совпадают с generate.yml; значения выбора профилей выводятся так же, как там.
      - name: Проверка генерации промптов Gemini
        env:
          GEN_GEMINI_API_KEY: ${{ secrets.GEN_GEMINI_API_KEY }}
          SRT_PATH: ${{ inputs.srt_path }}
          MISSING_PATH: ${{ inputs.missing_path }}
          # выбор моделей (none = модель выключена), как в generate.yml
          VIDEO_MODEL: ${{ inputs.video_profile }}
          PHOTO_MODEL: ${{ inputs.photo_profile }}
          # профиль видео: при none запасной ltx25 (как в generate.yml); профиль фото: пусто при none
          VIDEO_PROFILE: ${{ inputs.video_profile != 'none' && inputs.video_profile || 'ltx25' }}
          PHOTO_PROFILE: ${{ inputs.photo_profile != 'none' && inputs.photo_profile || '' }}
          VIDEO_PERCENT: ${{ inputs.video_percent }}
          INTRO_SECONDS: ${{ inputs.intro_seconds }}
          LIMIT_CLIPS: ${{ inputs.limit_clips }}
          PRESET: ${{ inputs.preset }}
          # Журнал как у generate.yml (SPEC 10): файл <каталог артефакта>/run/debug.log на уровне GEN_LOG_LEVEL.
          # Все файлы проверки лежат в одном каталоге артефакта.
          ART_DIR: verify-artifact
          PROMPTS_PATH: verify-artifact/prompts.json
          GEN_LOG_LEVEL: "DEBUG"
        run: |
          python - <<'PY'
          import argparse
          import importlib
          import logging
          import os
          import sys

          # Имя секрета собирается из частей (SPEC 0.1)
          KEY_NAME = "GEN_" + "GEMINI_API_KEY"
          secret = os.environ.get(KEY_NAME, "")
          SUMMARY = os.environ.get("GITHUB_STEP_SUMMARY")


          def mask(text) -> str:
              text = str(text)
              return text.replace(secret, "***") if secret else text


          def say(text: str = "") -> None:
              print(mask(text))


          def summary(text: str = "") -> None:
              if SUMMARY:
                  with open(SUMMARY, "a", encoding="utf-8") as fh:
                      fh.write(mask(text) + "\n")


          def fail(text: str) -> None:
              say("ОШИБКА: " + text)
              summary("## Проверка Gemini: ОШИБКА\n\n" + text)
              sys.exit(1)


          def find_symbol(name, modules):
              for prefix in ("Generate.core.", "core.", ""):
                  for mod in modules:
                      try:
                          module = importlib.import_module(prefix + mod)
                      except ImportError:
                          continue
                      obj = getattr(module, name, None)
                      if obj is not None:
                          return obj
              return None


          if not secret:
              fail("секрет для Gemini не задан в настройках репозитория")

          # Журнал как в cli.py: консоль и файл <ART_DIR>/run/debug.log на уровне GEN_LOG_LEVEL (пусто = INFO).
          log_level = os.environ.get("GEN_LOG_LEVEL", "").strip() or "INFO"
          if log_level not in ("INFO", "DEBUG"):
              fail("GEN_LOG_LEVEL допускает только значения INFO и DEBUG")
          art_dir = os.environ.get("ART_DIR", "").strip() or None
          setup_logging = find_symbol("setup_logging", ("log_setup",))
          set_known_secrets = find_symbol("set_known_secrets", ("log_setup",))
          if setup_logging is None:
              fail("в проекте не найден символ setup_logging")
          if set_known_secrets is not None:
              set_known_secrets([secret])  # ключ маскируется в журнале даже без имени (log_setup.py)
          # HTTP-библиотеки на DEBUG оставляем на WARNING, как в cli.py
          for noisy in ("httpx", "httpcore", "urllib3"):
              logging.getLogger(noisy).setLevel(logging.WARNING)
          if art_dir:
              os.makedirs(art_dir, exist_ok=True)
          handlers, log_note = setup_logging(log_level, art_dir)
          if log_note:
              say(log_note)

          video_model = os.environ["VIDEO_MODEL"]
          photo_model = os.environ["PHOTO_MODEL"]
          if video_model == "none" and photo_model == "none":
              fail("видео и фото выключены: проверять нечего")
          for name in ("SRT_PATH", "MISSING_PATH"):
              path = os.environ[name]
              if not os.path.isfile(path):
                  fail(f"файл не найден: {path}")

          try:
              limit = int(float(os.environ.get("LIMIT_CLIPS") or 0))
          except ValueError:
              fail("limit_clips должен быть числом")

          # Тот же путь, что у cli run: профили, пресет, распределение, промпты (без Vast и релиза).
          from Generate.cli import prepare_prompts_only

          ns = argparse.Namespace(
              srt=os.environ["SRT_PATH"],
              missing=os.environ["MISSING_PATH"],
              prompts_path=os.environ["PROMPTS_PATH"],
              artifact_dir=art_dir,
              video_model=video_model,
              video_profile=os.environ["VIDEO_PROFILE"],
              photo_profile=os.environ.get("PHOTO_PROFILE") or None,
              video_percent=os.environ.get("VIDEO_PERCENT") or "100",
              intro_seconds=os.environ.get("INTRO_SECONDS") or "10",
              limit_clips=limit,
              preset=os.environ.get("PRESET") or "none",
          )
          try:
              prep = prepare_prompts_only(ns)
          except Exception as exc:  # noqa: BLE001
              fail("подготовка промптов не удалась: " + type(exc).__name__ + ": " + mask(exc))

          with open(os.path.join(art_dir, "report.md"), "w", encoding="utf-8") as fh:
              fh.write(mask(prep.report_md))
          summary(prep.report_md)
          for line in prep.report_md.splitlines():
              say(line)

          if prep.problems or prep.failures:
              for p in prep.problems:
                  say("ПРОБЛЕМА: " + p)
              sys.exit(1)
          say(f"Проверка пройдена: промптов {len(prep.missing)}")
          PY

      - name: Загрузка prompts.json, distribution.json, отчёта и журнала
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-gemini-files
          # все файлы проверки лежат в каталоге verify-artifact; run/debug.log — журнал проверки
          path: |
            verify-artifact/prompts.json
            verify-artifact/distribution.json
            verify-artifact/report.md
            verify-artifact/run/debug.log
